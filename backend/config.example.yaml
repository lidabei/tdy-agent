# 复制为 config.yaml 后填写真实信息
database:
  dbtype: postgres
  host: 127.0.0.1
  name: tdy_manager
  password: your-password
  port: 5432
  username: postgres
  max_open_conns: 30
  max_idle_conns: 10

server:
  port: 8080
  mode: release
  jwt_secret: please-change-to-a-long-random-string
  password_min_len: 6
  upload_dir: uploads
  static_dir: ../frontend/dist
  cors_origins:
    - http://127.0.0.1:8080

business:
  withdraw_max_yuan: 50000
  withdraw_daily_max_yuan: 100000
